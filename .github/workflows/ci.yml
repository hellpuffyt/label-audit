name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage floor
        run: pytest -q --cov --cov-fail-under=95

  audit-the-example:
    name: audit the bundled example end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # The example deliberately contains cross-split contamination and a
      # label conflict, so the honest outcome is findings, exit code 3 —
      # asserted exactly, not just "ran without crashing". The near-duplicate
      # that differs by one character must NOT be merged, and the JSON output
      # must carry both duplicate findings.
      - name: exit codes are exactly as documented
        run: |
          set -euo pipefail
          set +e
          label-audit examples/reviews.csv > /dev/null
          gate=$?
          set -e
          test "$gate" = "3"
          label-audit examples/reviews.csv --fail-on never > /dev/null
          label-audit examples/reviews.csv --format json --fail-on never \
            | python -c "
          import json, sys
          audit = json.load(sys.stdin)
          checks = {f['check'] for f in audit['findings'] if f['severity'] == 'error'}
          assert 'duplicates' in checks, checks
          groups = audit['duplicates']
          assert any(g['crosses_splits'] for g in groups), groups
          assert any(g['conflicting_labels'] for g in groups), groups
          texts = [set(g['items']) for g in groups]
          assert {'r6', 'r7'} not in texts, 'near-duplicate was wrongly merged'
          print('example audit behaves exactly as documented')
          "

      - name: zero runtime dependencies
        run: |
          set -euo pipefail
          python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          assert deps == [], f"runtime dependencies declared: {deps}"
          print("dependencies = [] holds")
          EOF
