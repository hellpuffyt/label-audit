[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "label-audit"
version = "0.1.0"
description = "Audit a labelled dataset for annotator disagreement, class imbalance, duplicates across splits, and label leakage."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["labels", "annotation", "data-quality", "leakage", "dataset", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
label-audit = "label_audit.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/label-audit"
Issues = "https://github.com/hellpuffyt/label-audit/issues"
Changelog = "https://github.com/hellpuffyt/label-audit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/label_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["label_audit"]

[tool.coverage.report]
show_missing = true
